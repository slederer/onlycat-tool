# Temporary config for initial certificate issuance
server {
    listen 80;
    server_name oni.slederer.com slederer.com www.slederer.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 'Setting up SSL...';
        add_header Content-Type text/plain;
    }
}
