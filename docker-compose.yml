services:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./homepage:/usr/share/nginx/html:ro
    depends_on:
      - onlycat

  onlycat:
    build: .
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      - DB_PATH=/data/onlycat_events.db
      - SYNC_INTERVAL_MINUTES=10
      - LATITUDE=48.8631
      - LONGITUDE=2.3839
      - TIMEZONE=Europe/Paris
    volumes:
      - onlycat_data:/data

volumes:
  onlycat_data:
