# HTTP -> HTTPS redirect + ACME challenge
server {
    listen 80;
    server_name oni.slederer.com slederer.com www.slederer.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — OnlyCat Dashboard
server {
    listen 443 ssl;
    server_name oni.slederer.com;

    ssl_certificate /etc/letsencrypt/live/oni.slederer.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oni.slederer.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://onlycat:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# HTTPS — Homepage (proxied through FastAPI for auth)
server {
    listen 443 ssl default_server;
    server_name slederer.com www.slederer.com;

    ssl_certificate /etc/letsencrypt/live/oni.slederer.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oni.slederer.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://onlycat:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
